server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # SPA: cualquier ruta que no sea un archivo estático cae en index.html y la resuelve
    # el router del lado del cliente. `/merchant/*` nunca llega acá: el gateway lo intercepta
    # antes (las convenciones internas de API) y en local lo hace el proxy de Vite.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
