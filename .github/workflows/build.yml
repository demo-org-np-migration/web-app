name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/demo-org-np-migration/web-app
  # Mismo Keycloak para los dos entornos (las convenciones internas de API); lo que cambia por imagen es el realm.
  VITE_KEYCLOAK_URL: http://keycloak.platform.svc:8180

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - suffix: staging
            realm: cauri-staging
          - suffix: prod
            realm: cauri-prod
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "sha_tag=sha-$(git rev-parse --short=7 HEAD)-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_KEYCLOAK_REALM=${{ matrix.realm }}
            VITE_KEYCLOAK_URL=${{ env.VITE_KEYCLOAK_URL }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }}

  update-gitops-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Compute image tag
        id: tag
        run: echo "sha_tag=sha-${GITHUB_SHA::7}-staging" >> "$GITHUB_OUTPUT"

      - name: Checkout gitops
        uses: actions/checkout@v4
        with:
          repository: demo-org-np-migration/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Bump staging image tag
        working-directory: gitops
        env:
          SHA_TAG: ${{ steps.tag.outputs.sha_tag }}
        run: |
          yq -i '.image.tag = strenv(SHA_TAG)' apps/web-app/values-staging.yaml
          git config user.name "cauri-bot"
          git config user.email "cauri-bot@cauri.io"
          git add apps/web-app/values-staging.yaml
          git commit -m "chore(web-app): staging ${SHA_TAG}"
          git push

  update-gitops-prod:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Compute image tag
        id: tag
        run: echo "sha_tag=sha-${GITHUB_SHA::7}-prod" >> "$GITHUB_OUTPUT"

      - name: Checkout gitops
        uses: actions/checkout@v4
        with:
          repository: demo-org-np-migration/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Bump prod image tag
        working-directory: gitops
        env:
          SHA_TAG: ${{ steps.tag.outputs.sha_tag }}
        run: |
          yq -i '.image.tag = strenv(SHA_TAG)' apps/web-app/values-prod.yaml
          git config user.name "cauri-bot"
          git config user.email "cauri-bot@cauri.io"
          git add apps/web-app/values-prod.yaml
          git commit -m "chore(web-app): prod ${SHA_TAG}"
          git push
